name: 更新空气质量与预警（准实时）

# 轻量工作流：只刷新大气监测站（AQICN）数据 + 规则引擎预警，不跑遥感管线。
# 先从线上拉取上一轮发布的全部数据文件（遥感 json/png、预测等，public/data/ 已 gitignore），
# 再覆盖大气/预警后重新构建部署，保证影像/预测文件不丢失。

on:
  schedule:
    # 每天一次（07:23 UTC = 15:23 北京时间）。
    # 之前每 3 小时部署一次（一天 8 次），把 Netlify 免费套餐的部署额度用光了（403 credit exceeded），
    # 故降到每天一次。若额度仍紧张，可改成每周或只手动触发。
    - cron: "23 7 * * *"
  workflow_dispatch: {}

jobs:
  air-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取线上数据（遥感/预测/影像等）
        run: python rs-pipeline/fetch_live_data.py

      - name: 拉取最新空气质量监测站数据
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: python rs-pipeline/aqi.py

      - name: 生成分级预警
        run: python rs-pipeline/alerts.py

      - name: 生成治理决策
        run: python rs-pipeline/decision.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端
        run: |
          cd eco-monitor
          npm install
          npm run build

      - name: 部署到 Netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: python rs-pipeline/deploy.py
